# Build and test for repositories with custom property ros_version = ros2.
# Enforced on pull requests by the org ruleset "ros2".
#
# ROS 2 distro: variable ROS2_DISTRO (org-level default, repo-level override), fallback humble.
# Private dependencies: *.repos files in the repository root are imported with vcstool;
# for private repositories set the org secret CI_REPOS_TOKEN (read-only access to contents).
name: ros2-ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ros2-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (ROS 2 ${{ vars.ROS2_DISTRO || 'humble' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROS_IMAGE: ros:${{ vars.ROS2_DISTRO || 'humble' }}
    steps:
      - name: Checkout repository into the workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/src/${{ github.event.repository.name }}
          persist-credentials: false

      - name: Import dependencies from .repos files
        env:
          REPOS_TOKEN: ${{ secrets.CI_REPOS_TOKEN }}
        run: |
          shopt -s nullglob
          files=(ws/src/*/*.repos)
          if [ ${#files[@]} -eq 0 ]; then echo "No .repos files, skipping"; exit 0; fi
          if [ -n "$REPOS_TOKEN" ]; then
            git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          for f in "${files[@]}"; do
            echo "Importing $f"
            pipx run --spec vcstool==0.3.0 vcs import --recursive ws/src < "$f"
          done

      - name: Build and test in ${{ env.ROS_IMAGE }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/ws:/ws" -w /ws "$ROS_IMAGE" bash -ec '
            apt-get update -qq
            rosdep update --rosdistro "$ROS_DISTRO"
            rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO"
            source "/opt/ros/$ROS_DISTRO/setup.bash"
            colcon build --event-handlers console_cohesion+ \
              --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
            colcon test --event-handlers console_cohesion+
            colcon test-result --verbose
          '
