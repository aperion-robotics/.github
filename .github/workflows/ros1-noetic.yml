# Aperion Robotics - ROS 1 Noetic CI
#
# ROS Noetic is EOL and is treated as a legacy compatibility target.
#
# CI implementation:
#   ROS-Industrial industrial_ci
#
# This workflow:
#   - builds in the canonical ROS Noetic / Ubuntu Focal environment
#   - uses Python 3
#   - installs dependencies through rosdep
#   - builds with catkin_tools
#   - runs package tests
#   - verifies package installation
#   - runs catkin_lint
#   - runs clang-tidy static analysis
#   - runs Python pylint error checks
#
# Package-level ROS1 style checks such as roslint remain supported and are
# executed as part of the package test suite.
#
# Intended ruleset target:
#   ros1_noetic = true

name: ROS1 Noetic CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  industrial-ci:
    name: ROS1 Noetic / industrial_ci
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, test and analyze
        uses: ros-industrial/industrial_ci@125164b9f1883cdf1858897a7146d1bebf2be5c6
        env:
          ROS_DISTRO: noetic
          ROS_REPO: main
          BUILDER: catkin_tools

          CATKIN_LINT: "true"
          CLANG_TIDY: "true"

          PYLINT_CHECK: "true"
          PYLINT_ARGS: "--errors-only"

          VERBOSE_TESTS: "true"
