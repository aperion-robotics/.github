# Aperion Robotics - ROS 1 Melodic CI
#
# ROS Melodic is EOL and is treated as a legacy compatibility target.
#
# CI implementation:
#   ROS-Industrial industrial_ci
#
# This workflow:
#   - builds the repository in the canonical ROS Melodic / Ubuntu Bionic environment
#     (industrial_ci uses the final Melodic snapshot and rosdistro tag automatically)
#   - installs dependencies through rosdep
#   - builds using catkin_tools
#   - runs package tests
#   - verifies package installation
#   - runs catkin_lint
#   - runs clang-tidy static analysis
#
# Repository files (all optional):
#   .ci/ros1-melodic.repos  private/source dependencies (vcstool format); every
#                           aperion-robotics repository must be allowlisted in
#                           ci/source-deps/allowed-repositories.txt
#   .ci/ros1-melodic.env    allowlisted industrial_ci options, see README
#
# Source-code style checks such as roslint remain package-level tests.
#
# This workflow is intended to be required by an organization ruleset for
# repositories with ros1_melodic = true.

name: ROS1 Melodic CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ref of aperion-robotics/.github that provides the CI scripts and the
  # source dependency allowlist. Keep it equal to the ref the rulesets require.
  APERION_CI_REF: main

jobs:
  industrial-ci:
    name: ROS1 Melodic / industrial_ci

    # The central .github repository contains CI configuration, not ROS code.
    if: ${{ github.repository != 'aperion-robotics/.github' }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout approved Aperion CI configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aperion-robotics/.github
          ref: ${{ github.workflow_sha }}
          path: .aperion-ci
          persist-credentials: false

      - name: Load repository CI options
        shell: bash
        run: |
          .aperion-ci/ci/scripts/load-ci-options.sh .ci/ros1-melodic.env \
            ROSDEP_SKIP_KEYS ADDITIONAL_DEBS \
            CMAKE_ARGS TARGET_CMAKE_ARGS UPSTREAM_CMAKE_ARGS \
            CATKIN_LINT_ARGS CLANG_TIDY_ARGS

      - name: Detect source dependency manifest
        id: source-deps
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ".ci/ros1-melodic.repos" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ROS 1 Melodic source dependency manifest found."

            # The dependency token is scoped to the allowlisted Aperion
            # repositories that the manifest references.
            repos=$(.aperion-ci/ci/scripts/source-deps.sh resolve \
              .ci/ros1-melodic.repos \
              .aperion-ci/ci/source-deps/allowed-repositories.txt)
            echo "repositories=${repos}" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ROS 1 Melodic source dependency manifest found."
          fi

      - name: Create Aperion dependency token
        if: steps.source-deps.outputs.repositories != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APERION_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.APERION_CI_APP_PRIVATE_KEY }}
          owner: aperion-robotics
          repositories: ${{ steps.source-deps.outputs.repositories }}
          permission-contents: read

      # The token exists only in this step; industrial_ci never sees it.
      - name: Import Aperion source dependencies
        if: steps.source-deps.outputs.present == 'true'
        shell: bash
        env:
          APERION_CI_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          .aperion-ci/ci/scripts/source-deps.sh import \
            .ci/ros1-melodic.repos \
            .aperion-upstream

      - name: Configure industrial_ci source workspaces
        if: steps.source-deps.outputs.present == 'true'
        shell: bash
        run: |
          echo "UPSTREAM_WORKSPACE=.aperion-upstream" >> "$GITHUB_ENV"
          echo "TARGET_WORKSPACE=. -.aperion-upstream" >> "$GITHUB_ENV"

      # Caches are scoped to the pull request, so later pushes and re-runs
      # of the same pull request reuse the compiler cache.
      - name: Cache compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ros1-melodic-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-ros1-melodic-${{ github.event.pull_request.number || github.ref }}-
            ccache-ros1-melodic-

      - name: Build, test and analyze
        uses: ros-industrial/industrial_ci@125164b9f1883cdf1858897a7146d1bebf2be5c6 # master 2026-06-01 (no release tags since 2020)
        env:
          ROS_DISTRO: melodic
          BUILDER: catkin_tools
          CCACHE_DIR: ${{ runner.temp }}/ccache

          CATKIN_LINT: "true"

          CLANG_TIDY: "true"
          CLANG_TIDY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

          VERBOSE_TESTS: "true"
