# Checks for every repository in aperion-robotics.
# Enforced on pull requests by the org ruleset "baseline" (rule: Require workflows to pass).
# Runs in the context of the repository that opened the pull request.
name: common

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: common-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  ORG_CI_REF: main

jobs:
  style:
    name: style (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout org CI config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aperion-robotics/.github
          ref: ${{ env.ORG_CI_REF }}
          path: .org-ci
          persist-credentials: false

      - name: Run pre-commit on changed files
        run: |
          pipx run --spec pre-commit==4.6.2 pre-commit run \
            --config .org-ci/ci/pre-commit-config.yaml \
            --from-ref "$BASE_SHA" --to-ref HEAD \
            --show-diff-on-failure --color=always

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits of this pull request
        # --redact keeps any detected secret out of the logs (public repos have public logs).
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..HEAD" .
