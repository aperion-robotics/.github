# Aperion Robotics — Dependency Review
#
# Prevents pull requests from introducing dependencies with known
# vulnerabilities in ecosystems supported by the GitHub Dependency Graph.
#
# NOTE:
# ROS package.xml dependencies are validated separately through rosdep
# and the ROS-specific CI workflows.

name: Dependency Review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-openssf-scorecard: true
