# Aperion Robotics organization-wide baseline CI.
#
# Purpose:
#   Generic repository hygiene checks applicable to all managed repositories.
#
# IMPORTANT:
#   - No ROS-specific checks belong here.
#   - No C++/Python style enforcement belongs here.
#   - ROS1/ROS2 style, build and test checks run in distro-specific workflows.
#
# This workflow is intended to be enforced through organization rulesets.

name: Aperion Baseline

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRE_COMMIT_VERSION: 4.6.2

jobs:
  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Consumer repositories use the approved organization configuration
      # from aperion-robotics/.github@main.
      #
      # When this workflow runs inside aperion-robotics/.github itself,
      # the configuration under review is already present in the working tree.
      - name: Checkout approved Aperion CI configuration
        if: ${{ github.repository != 'aperion-robotics/.github' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aperion-robotics/.github
          ref: main
          path: .aperion-ci
          persist-credentials: false

      - name: Determine comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              BASE_SHA="${{ github.event.merge_group.base_sha }}"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          if [[ -z "${BASE_SHA}" ]]; then
            echo "Unable to determine comparison base SHA."
            exit 1
          fi

          echo "Using base SHA: ${BASE_SHA}"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Select baseline configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" == "aperion-robotics/.github" ]]; then
            CONFIG="ci/precommit/baseline.yaml"
          else
            CONFIG=".aperion-ci/ci/precommit/baseline.yaml"
          fi

          if [[ ! -f "$CONFIG" ]]; then
            echo "Baseline configuration not found: $CONFIG"
            exit 1
          fi

          echo "Using configuration: $CONFIG"
          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles(steps.config.outputs.path) }}

      - name: Validate baseline configuration
        shell: bash
        run: |
          set -euo pipefail

          pipx run \
            --spec "pre-commit==${PRE_COMMIT_VERSION}" \
            pre-commit validate-config \
            "${{ steps.config.outputs.path }}"

      - name: Run baseline pre-commit checks
        shell: bash
        run: |
          set -euo pipefail

          pipx run \
            --spec "pre-commit==${PRE_COMMIT_VERSION}" \
            pre-commit run \
            --config "${{ steps.config.outputs.path }}" \
            --from-ref "${{ steps.base.outputs.base_sha }}" \
            --to-ref HEAD \
            --show-diff-on-failure \
            --color=always

      # The pre-commit checks below run even after a failed check
      # in order to produce a report for all problems at once.
      # These checks lead to a failure only for the production profile
      - name: Run advisory pre-commit checks (spelling, GitHub Actions)
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event.repository.custom_properties.quality_profile != 'production' }}
        shell: bash
        run: |
          set -euo pipefail

          rc=0
          config="${{ steps.config.outputs.path }}"
          for hook in $(yq -r '.repos[].hooks[] | select(.stages // [] | contains(["manual"])) | .id' "$config"); do
            pipx run \
              --spec "pre-commit==${PRE_COMMIT_VERSION}" \
              pre-commit run "$hook" \
              --hook-stage manual \
              --config "$config" \
              --from-ref "${{ steps.base.outputs.base_sha }}" \
              --to-ref HEAD \
              --color=always || rc=1
          done
          exit "$rc"

      # Scan for secrets on all new commits in the history
      # This tries to avoid deleted secrets being leaked from older commits
      - name: Scan new commits for secrets
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@005b692bdfd0764e5da402887d9ab9196f8023dc # v3.99.1
        with:
          base: ${{ steps.base.outputs.base_sha }}
          head: ${{ github.sha }}
          extra_args: --results=verified,unknown

      # Lint every commit of the pull request. The last commit
      # of a merge is also linted.
      # These checks lead to just a warning for experimental and legacy profiles
      - name: Check commit messages (Conventional Commits)
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event.repository.custom_properties.quality_profile == 'experimental' || github.event.repository.custom_properties.quality_profile == 'legacy' }}
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ${{ github.repository == 'aperion-robotics/.github' && 'ci/commitlint/.commitlintrc.yml' || '.aperion-ci/ci/commitlint/.commitlintrc.yml' }}
          helpURL: https://github.com/aperion-robotics/.github/blob/main/CONTRIBUTING.md#commit-messages

      # Just a report (no fail triggers)
      # repohealth's repository explaines the scoring system
      # 70 was chosed arbitrarily, based on defaults
      - name: Check repository health (non-blocking)
        id: repohealth
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: spbuilds/repohealth@5cfba7f0c7bcb3d6eb56e6a986a946c6d8ac09a7 # v0.5.3
        with:
          threshold: 70
          format: terminal
          version: v0.5.3

      - name: Show repository health score
        if: ${{ !cancelled() && steps.repohealth.outputs.score != '' }}
        env:
          SCORE: ${{ steps.repohealth.outputs.score }}
          GRADE: ${{ steps.repohealth.outputs.grade }}
        run: echo "RepoHealth score $SCORE ($GRADE)"
