# Build and test for repositories with custom property ros_version = ros1.
# Enforced on pull requests by the org ruleset "ros1".
#
# ROS 1 distro: variable ROS1_DISTRO (org-level default, repo-level override), fallback noetic.
# Private dependencies: *.repos files in the repository root are imported with vcstool;
# for private repositories set the org secret CI_REPOS_TOKEN (read-only access to contents).
#
# The build runs with `docker run` instead of a job container on purpose: the Node-based
# actions (checkout) cannot run inside old images such as ros:melodic (Ubuntu 18.04).
name: ros1-ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ros1-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (ROS 1 ${{ vars.ROS1_DISTRO || 'noetic' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROS_IMAGE: ros:${{ vars.ROS1_DISTRO || 'noetic' }}
    steps:
      - name: Checkout repository into the workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/src/${{ github.event.repository.name }}
          persist-credentials: false

      - name: Import dependencies from .repos files
        env:
          REPOS_TOKEN: ${{ secrets.CI_REPOS_TOKEN }}
        run: |
          shopt -s nullglob
          files=(ws/src/*/*.repos)
          if [ ${#files[@]} -eq 0 ]; then echo "No .repos files, skipping"; exit 0; fi
          if [ -n "$REPOS_TOKEN" ]; then
            git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          for f in "${files[@]}"; do
            echo "Importing $f"
            pipx run --spec vcstool==0.3.0 vcs import --recursive ws/src < "$f"
          done

      - name: Fetch the current ROS apt key
        # Images of end-of-life distros may still ship the pre-2025 key, which has expired.
        run: |
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | gpg --dearmor -o "$RUNNER_TEMP/ros-archive-keyring.gpg"

      - name: Build and test in ${{ env.ROS_IMAGE }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/ws:/ws" -w /ws \
            -v "$RUNNER_TEMP/ros-archive-keyring.gpg:/usr/share/keyrings/ros-archive-keyring.gpg:ro" \
            "$ROS_IMAGE" bash -ec '
              rm -f /etc/apt/sources.list.d/ros*.list /etc/apt/sources.list.d/ros*.sources
              echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
                > /etc/apt/sources.list.d/ros1.list
              apt-get update -qq
              rosdep update --include-eol-distros
              rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO"
              source "/opt/ros/$ROS_DISTRO/setup.bash"
              catkin_make -DCMAKE_BUILD_TYPE=RelWithDebInfo
              catkin_make run_tests
              if [ -d build/test_results ]; then catkin_test_results --verbose build/test_results; fi
            '
