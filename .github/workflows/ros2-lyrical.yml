# Aperion Robotics - ROS 2 Lyrical CI
#
# Long-term production ROS 2 target:
#   ROS 2 Lyrical
#   Ubuntu 26.04 Resolute
#
# CI implementation:
#   ROS Tooling Working Group - action-ros-ci
#
# This workflow:
#   - creates a clean ROS 2 workspace
#   - installs declared dependencies through rosdep
#   - builds the workspace with colcon
#   - runs package tests with colcon
#   - executes package-level ament_lint tests
#
# ROS 2 packages are expected to use:
#   ament_lint_auto
#   ament_lint_common
#
# Intended ruleset target:
#   ros2_lyrical = true

name: ROS2 Lyrical CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ROS2 Lyrical / build & test

    # The central .github repository contains CI configuration, not ROS code.
    if: ${{ github.repository != 'aperion-robotics/.github' }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      # ubuntu-resolute-ros-lyrical-ros-base-latest (linux/amd64)
      image: rostooling/setup-ros-docker@sha256:1cb73beff50713ce680ad3b1040bcad954b838fd8701686d9192c99af95d4e27

    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect source dependency manifest
        id: source-deps
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ".ci/ros2-lyrical.repos" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "file=${GITHUB_WORKSPACE}/.ci/ros2-lyrical.repos" >> "$GITHUB_OUTPUT"
            echo "ROS 2 Lyrical source dependency manifest found."

            # Private Aperion repositories referenced by the manifest; the
            # dependency token is scoped to exactly these repositories.
            repos=$(grep -oE 'github\.com[:/]aperion-robotics/[A-Za-z0-9._-]+' ".ci/ros2-lyrical.repos" \
              | sed -E 's#.*/##; s/\.git$//' | sort -u | paste -sd, - || true)
            echo "repositories=${repos}" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "No ROS 2 Lyrical source dependency manifest found."
          fi

      - name: Create Aperion dependency token
        if: steps.source-deps.outputs.repositories != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APERION_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.APERION_CI_APP_PRIVATE_KEY }}
          owner: aperion-robotics
          repositories: ${{ steps.source-deps.outputs.repositories }}
          permission-contents: read

      - name: Build and test ROS 2 workspace
        uses: ros-tooling/action-ros-ci@3a640b10f09b756dabe556dac5413aba369f71b0 # 0.4.8
        with:
          target-ros2-distro: lyrical

          # Empty when the repository does not define source dependencies.
          vcs-repo-file-url: ${{ steps.source-deps.outputs.file }}

          # Use the read-only GitHub App token for private dependencies.
          # Fall back to the repository GITHUB_TOKEN when there is no
          # private dependency manifest.
          import-token: ${{ steps.app-token.outputs.token || github.token }}

          # Coverage will be enabled later as a dedicated quality gate.
          coverage-result: false
