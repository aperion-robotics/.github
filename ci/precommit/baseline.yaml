# Aperion Robotics generic repository checks.
#
# These checks intentionally contain NO ROS-specific C++ or Python style rules.
# ROS-specific linting belongs in the ROS distro CI workflows.

exclude: |
  (?x)^(
    third_party/|
    vendor/|
    external/|
    \.aperion-ci/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=10000
          - --enforce-all

      - id: check-case-conflict

      - id: check-merge-conflict

      - id: check-symlinks

      - id: check-yaml
        args:
          - --allow-multiple-documents

      - id: check-json

      - id: check-toml

      - id: check-xml

      - id: detect-private-key

      - id: end-of-file-fixer

      - id: mixed-line-ending
        args:
          - --fix=lf

      - id: trailing-whitespace