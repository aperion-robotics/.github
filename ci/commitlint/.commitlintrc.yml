---
# Aperion commit message rules (Conventional Commits), enforced on pull
# requests and merge queues by .github/workflows/baseline.yml.
# Rules: https://commitlint.js.org/reference/rules.html
# Format: [severity 0..2, applicability always|never, value]
extends: '@commitlint/config-conventional'

rules:
  header-max-length: [2, always, 100]
  type-case: [2, always, lower-case]
  type-empty: [2, never]
  type-enum: [2, always, [build, ci, chore, docs, feat, fix, perf, refactor, revert, style, test]]
  scope-case: [2, always, lower-case]
  subject-case: [2, never, [sentence-case, start-case, pascal-case, upper-case]]
  subject-empty: [2, never]
  subject-full-stop: [2, never, "."]
  body-leading-blank: [2, always]
  body-max-line-length: [2, always, 100]
  footer-leading-blank: [2, always]
  footer-max-line-length: [2, always, 100]
